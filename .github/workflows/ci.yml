#
# Lint, type-check and test on every push and pull request. Tests that need the
# EuroCrops layer or the live NASA POWER API are skipped automatically.
name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Lint (ruff)
        run: ruff check .
      - name: Type-check (mypy)
        run: mypy dss dss_pipeline.py run_demo.py
      - name: Test (pytest)
        run: pytest --cov=dss --cov-report=term-missing
