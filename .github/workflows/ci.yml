#
# Lint, type-check and test on every push and pull request (Python 3.10, the
# project's target version). Integration tests run on the bundled EuroCrops
# layer; live NASA POWER tests are skipped.
name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Lint (ruff)
        run: ruff check .
      - name: Type-check (mypy)
        run: mypy dss dss_pipeline.py run_demo.py
      - name: Test (pytest)
        run: pytest --cov=dss --cov=dss_pipeline --cov-report=term-missing
